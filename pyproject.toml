[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outloud"
version = "0.1.0"
description = "Reads PDFs and any text on your screen out loud. Mac first, Windows too. Works offline with the voices already on your computer."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Marc Pineault" }]
dependencies = [
  "pymupdf>=1.24",
  "Pillow>=10",
  "pynput>=1.7.6",
  "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "pyttsx3>=2.98; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.11"]
# Windows OCR uses the engine built into Windows 10/11. Installed separately because
# its wheels lag new Python versions: pip install winocr
windows-ocr = ["winocr; sys_platform == 'win32'"]

[project.scripts]
outloud = "outloud.app:main"

[project.gui-scripts]
outloud-gui = "outloud.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
